<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Phased workstreams and gates">
<title>Phased Workstreams and Gates — P0 to P5</title>
<rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Phased Workstreams + Gates — P0 to P5</text>
<text x="30" y="58" font-size="11" fill="#444">Workstream A (hub) ships first · Workstream B (SYM-2P) decoupled · Leo §13 gates + kill conditions K1–K5</text>
<style>
.box{fill:#fff;stroke:#111;stroke-width:1.6}
.a{fill:#eef7ee;stroke:#0E7A3D;stroke-width:1.8}
.b{fill:#eef3fb;stroke:#1D4ED8;stroke-width:1.8}
.g{fill:#fff8e6;stroke:#8A5A00;stroke-width:1.6}
.t{font-size:12px;font-weight:bold;fill:#111}
.s{font-size:10px;fill:#333}
.tag{font-size:9px;font-weight:bold}
.ln{stroke:#111;stroke-width:1.8;fill:none}
</style>

<!-- axis -->
<line x1="40" y1="110" x2="960" y2="110" stroke="#111" stroke-width="2"/>
<text class="tag" x="40" y="100" fill="#0E7A3D">WORKSTREAM A — HUB (sequential P0→P3, then P5 options)</text>
<text class="tag" x="700" y="100" fill="#1D4ED8">WORKSTREAM B — SYM-2P (parallel after P0)</text>

<!-- P0 -->
<rect class="box" x="40" y="130" width="140" height="150" rx="6"/>
<text class="t" x="52" y="152">P0 Contract</text>
<text class="s" x="52" y="166">freeze (no code)</text>
<text class="s" x="52" y="182">record schema · DSSE</text>
<text class="s" x="52" y="196">CloudEvents types</text>
<text class="s" x="52" y="210">DID shape · recovery</text>
<text class="s" x="52" y="224">invariants I1–I9</text>
<text class="s" x="52" y="240">exit: Frida + Mozi</text>
<text class="s" x="52" y="254">review, owner ratify</text>

<!-- P1 -->
<rect class="a" x="200" y="130" width="140" height="150" rx="6"/>
<text class="t" x="212" y="152">P1 Write path</text>
<text class="s" x="212" y="166">proxy + Rekor ns</text>
<text class="s" x="212" y="182">key registration</text>
<text class="s" x="212" y="196">first records</text>
<text class="s" x="212" y="212">exit: T1 round-trip</text>
<text class="s" x="212" y="226">via rekor-cli,</text>
<text class="s" x="212" y="240">clean machine</text>
<text class="tag" x="212" y="262" fill="#B3261E">KILL K1: log down 2w</text>
<text class="s" x="212" y="274">+ A2 unfunded → halt A</text>

<!-- P2 -->
<rect class="a" x="360" y="130" width="140" height="150" rx="6"/>
<text class="t" x="372" y="152">P2 Read path</text>
<text class="s" x="372" y="166">Pages verifier (I5)</text>
<text class="s" x="372" y="182">CLI verifier</text>
<text class="s" x="372" y="196">offline bundle (T3)</text>
<text class="s" x="372" y="212">exit: T1–T4 pass</text>
<text class="tag" x="372" y="234" fill="#B3261E">KILL K2: offline fail</text>
<text class="s" x="372" y="248">→ display-only +</text>
<text class="s" x="372" y="262">"unverified" labels</text>

<!-- P3 -->
<rect class="a" x="520" y="130" width="160" height="150" rx="6"/>
<text class="t" x="532" y="152">P3 Witness quorum</text>
<text class="s" x="532" y="166">W1 mirror + W2 monitor</text>
<text class="s" x="532" y="182">verifier corroboration</text>
<text class="s" x="532" y="196">exit: T5 split-view</text>
<text class="s" x="532" y="210">detected; 30-day soak</text>
<text class="s" x="532" y="224">starts</text>
<text class="tag" x="532" y="246" fill="#8A5A00">WORDING GATE: only after</text>
<text class="s" x="532" y="260">soak may copy say</text>
<text class="s" x="532" y="274">"publicly verifiable"</text>

<!-- P4 B -->
<rect class="b" x="700" y="130" width="140" height="150" rx="6"/>
<text class="t" x="712" y="152">P4 SYM-2P S1</text>
<text class="s" x="712" y="166">1:1 sealed-box</text>
<text class="s" x="712" y="182">ciphertext-hash at</text>
<text class="s" x="712" y="196">send · SD-JWT flow</text>
<text class="s" x="712" y="212">exit: T6–T8 pass;</text>
<text class="s" x="712" y="226">wire lock unbroken</text>
<text class="tag" x="712" y="248" fill="#B3261E">KILL K3: no consumer</text>
<text class="s" x="712" y="262">→ drop MLS forever</text>

<!-- P5 -->
<rect class="g" x="860" y="130" width="100" height="150" rx="6"/>
<text class="t" x="872" y="152">P5 Cond.</text>
<text class="s" x="872" y="166">MLS S2</text>
<text class="s" x="872" y="182">STH anchor</text>
<text class="s" x="872" y="198">A2 migration</text>
<text class="s" x="872" y="214">each: owner</text>
<text class="s" x="872" y="230">gate</text>
<text class="tag" x="872" y="252" fill="#B3261E">KILL K4/K5</text>

<path class="ln" d="M180 205 H200"/><path d="M200 205 l-8 -4 v8 z" fill="#111"/>
<path class="ln" d="M340 205 H360"/><path d="M360 205 l-8 -4 v8 z" fill="#111"/>
<path class="ln" d="M500 205 H520"/><path d="M520 205 l-8 -4 v8 z" fill="#111"/>
<path class="ln" d="M680 205 H700" stroke="#1D4ED8"/><path d="M700 205 l-8 -4 v8 z" fill="#1D4ED8"/>
<path class="ln" d="M840 205 H860" stroke="#8A5A00"/><path d="M860 205 l-8 -4 v8 z" fill="#8A5A00"/>

<!-- soak bar -->
<text class="t" x="40" y="320">Soak + wording gate (P3 exit → "publicly verifiable")</text>
<rect x="40" y="332" width="920" height="34" fill="#fff" stroke="#111" stroke-width="1.6" rx="6"/>
<rect x="42" y="334" width="560" height="30" fill="#0E7A3D" opacity="0.25"/>
<rect x="42" y="334" width="560" height="30" fill="none" stroke="#0E7A3D" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="s" x="54" y="354">day 0 — witnesses live, copy: "cryptographically logged, witness coverage pending"</text>
<text class="s" x="620" y="354">day 30 — owner gate 2 unlocks "publicly verifiable"</text>

<!-- owner gates -->
<text class="t" x="40" y="400">Owner-held gates (council cannot cross)</text>
<rect class="g" x="40" y="412" width="920" height="96" rx="6"/>
<text class="s" x="54" y="434">1 · log tenancy final (A1 start is recommendation; A2 costs money)      2 · any public post + "publicly verifiable" wording after soak      3 · signing-key + offline-recovery-key custody ceremony</text>
<text class="s" x="54" y="452">4 · chain / RFC-3161 anchoring activation      5 · MLS Stage-2 activation      6 · canonical repo naming (provisional: protean-hub-site / -log / sym2p-protocol)</text>
<text class="s" x="54" y="470">7 · any legal-grade timestamp use case (pulls P5 anchoring forward)      K4: W1 needs babysitting → re-scope claim      K5: contract &gt; 1 page → stop, re-draw boundary</text>
<text class="s" x="54" y="488">ASSUMPTION: org holds one offline recovery key in cold storage (else recovery = manual re-registration ceremony). OPEN: W2 operator · retention ("keep forever" to confirm).</text>

<!-- legend -->
<text class="t" x="40" y="540">Legend + print note</text>
<rect x="40" y="550" width="18" height="14" fill="#eef7ee" stroke="#0E7A3D" stroke-width="1.6"/>
<text class="s" x="64" y="561">Workstream A (hub)</text>
<rect x="230" y="550" width="18" height="14" fill="#eef3fb" stroke="#1D4ED8" stroke-width="1.6"/>
<text class="s" x="254" y="561">Workstream B (SYM-2P)</text>
<rect x="430" y="550" width="18" height="14" fill="#fff8e6" stroke="#8A5A00" stroke-width="1.6"/>
<text class="s" x="454" y="561">Gated / conditional</text>
<rect x="600" y="550" width="18" height="14" fill="#fff" stroke="#B3261E" stroke-width="1.6"/>
<text class="s" x="624" y="561">Kill condition</text>
<text class="s" x="40" y="590">All three diagrams: white ground, ink text, text+pattern (never color alone), system sans, self-contained SVG (no external refs) — legible at A4 grayscale and in PDF export.</text>
<text class="s" x="40" y="608">Contract A↔B stays one page: CloudEvents envelope + DSSE + payload_hash in, proof out. A never parses B disclosure internals.</text>
<text class="s" x="40" y="626">RECOMMENDATION: Mozi starts P1 on public Rekor immediately; P2 verifier strings implement Frida §2.2 taxonomy verbatim (shared vocabulary = shared honesty).</text>
</svg>